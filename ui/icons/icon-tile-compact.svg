  <path d="M16 6.75A9.25 9.25 0 1 0 25.25 16" fill="none" stroke="#f3f5f1" stroke-width="5" stroke-linecap="round"/>
  <path d="M16 6.75L25.25 16" stroke="#c6f24e" stroke-width="5" stroke-linecap="round"/>
</svg>
