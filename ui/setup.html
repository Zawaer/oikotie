<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="setupPageTitle">Asetukset</title>
    <link rel="stylesheet" href="brand.css">
    <link rel="stylesheet" href="setup.css">
</head>
<body>
    <div class="setup-page">
        <aside class="brand-panel">
            <div class="brand-lockup">
                <svg viewBox="0 0 32 32" aria-hidden="true" focusable="false">
                    <rect width="32" height="32" rx="8" fill="#16413a"/>
                    <path d="M16 7.5A8.5 8.5 0 1 0 24.5 16" fill="none" stroke="#f3f5f1" stroke-width="4" stroke-linecap="round"/>
                    <path d="M16 7.5L24.5 16" stroke="#c6f24e" stroke-width="4" stroke-linecap="round"/>
                </svg>
                <span>Oikotie</span>
            </div>

            <div class="brand-copy">
                <p class="brand-headline" data-i18n="setupBrandHeadline">Kirjautuminen ilman kiertoteitä.</p>
                <p class="brand-body" data-i18n="setupBrandBody"></p>
                <div class="brand-note">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
                    <span data-i18n="setupPasswordNote"></span>
                </div>
            </div>

            <div class="brand-footer">
                <span id="versionDisplay">Oikotie</span>
                <a href="https://github.com/Zawaer/oikotie" target="_blank" rel="noopener noreferrer" data-i18n="setupSourceCode">Lähdekoodi</a>
                <a href="https://forms.gle/6USnxpRyRLnYk7R28" target="_blank" rel="noopener noreferrer" data-i18n="popupFeedback">Anna palautetta</a>
                <a href="https://forms.gle/bDJZyb3WbQ5Twrsr9" target="_blank" rel="noopener noreferrer" data-i18n="popupReportBug">Ilmoita ongelmasta</a>
            </div>
        </aside>

        <main class="form-column">
            <div class="setup-form">
                <div class="form-head">
                    <h1 class="setup-title" data-i18n="setupPageTitle">Asetukset</h1>
                    <fieldset class="segmented">
                        <legend class="visually-hidden" data-i18n="setupLangLabel">Kieli</legend>
                        <label><input type="radio" name="lang" value="fi"><span data-i18n="setupLangFi">Suomi</span></label>
                        <label><input type="radio" name="lang" value="en"><span data-i18n="setupLangEn">English</span></label>
                    </fieldset>
                </div>

                <form id="setupForm" class="setup-form">
                    <section class="form-section">
                        <span class="eyebrow"><span aria-hidden="true">1 · </span><span data-i18n="setupSectionSchool">Koulu</span></span>
                        <div class="form-group">
                            <label for="schoolSearch" data-i18n="setupSchoolLabel">Koulun nimi</label>
                            <div class="school-selector">
                                <input type="text" id="schoolSearch" class="field" data-i18n="setupSchoolPlaceholder" data-i18n-attr="placeholder" autocomplete="off">
                                <div id="schoolDropdown" class="school-dropdown"></div>
                            </div>
                            <p id="schoolErrorMessage" class="school-error-message"></p>
                            <p id="unsupportedSchoolMessage" class="school-support-message"></p>
                            <input type="hidden" id="schoolName">
                        </div>
                        <div class="form-group">
                            <label for="adfsDomain" data-i18n="setupDomainLabel">Kirjautumisosoite</label>
                            <input type="text" id="adfsDomain" class="field mono" data-i18n="setupDomainPlaceholder" data-i18n-attr="placeholder" required autocomplete="off">
                            <p class="form-hint" data-i18n="setupDomainHint"></p>
                        </div>
                    </section>

                    <fieldset class="form-section">
                        <legend class="eyebrow"><span aria-hidden="true">2 · </span><span data-i18n="setupNovaRoleLabel">Nova</span></legend>
                        <p class="section-hint" data-i18n="setupNovaRoleHint"></p>
                        <div class="option-grid">
                            <label class="option-card">
                                <input type="radio" name="novaRole" value="student">
                                <span class="option-title" data-i18n="setupNovaRoleStudent">Opiskelija</span>
                                <span class="option-detail" data-i18n="setupNovaRoleStudentDetail"></span>
                            </label>
                            <label class="option-card">
                                <input type="radio" name="novaRole" value="pupil">
                                <span class="option-title" data-i18n="setupNovaRolePupil">Oppilas</span>
                                <span class="option-detail" data-i18n="setupNovaRolePupilDetail"></span>
                            </label>
                            <label class="option-card">
                                <input type="radio" name="novaRole" value="teacher">
                                <span class="option-title" data-i18n="setupNovaRoleTeacher">Opettaja</span>
                                <span class="option-detail" data-i18n="setupNovaRoleTeacherDetail"></span>
                            </label>
                        </div>
                    </fieldset>

                    <fieldset class="form-section">
                        <legend class="eyebrow"><span aria-hidden="true">3 · </span><span data-i18n="setupStudeoLevelLabel">Studeo</span></legend>
                        <p class="section-hint" data-i18n="setupStudeoLevelHint"></p>
                        <div class="option-grid">
                            <label class="option-card">
                                <input type="radio" name="studeoLevel" value="secondary">
                                <span class="option-title" data-i18n="setupStudeoLevelSecondary">Yläkoulu tai lukio</span>
                                <span class="option-detail" data-i18n="setupStudeoLevelSecondaryDetail"></span>
                            </label>
                            <label class="option-card">
                                <input type="radio" name="studeoLevel" value="elementary">
                                <span class="option-title" data-i18n="setupStudeoLevelElementary">Alakoulu</span>
                                <span class="option-detail" data-i18n="setupStudeoLevelElementaryDetail"></span>
                            </label>
                        </div>
                    </fieldset>

                    <button type="submit" class="btn-save" id="saveBtn">
                        <span data-i18n="setupSaveBtn">Tallenna</span>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
                    </button>
                    <p class="school-error-message form-error-message" id="successMsg"></p>
                </form>
            </div>
        </main>
    </div>
    <script src="../scripts/services.js"></script>
    <script src="i18n.js"></script>
    <script src="preconfigured-school-domains.js"></script>
    <script src="setup.js"></script>
</body>
</html>
