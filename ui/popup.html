<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oikotie</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body class="popup-page">
    <div class="container">
        <header class="popup-header">
            <!-- currentColor picks up the header's white text, so the mark
                 needs no separate light/dark asset. -->
            <svg class="popup-logo" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
                <path d="M3.6 20.8 C4.2 7.4 19.5 3.6 26 11" fill="none" stroke="currentColor" stroke-width="3.3" stroke-linecap="round"/>
                <polygon points="30.4,16.5 22.9,13.5 29.1,8.5" fill="currentColor"/>
                <circle cx="5" cy="27.6" r="3" fill="currentColor"/>
                <circle cx="14.5" cy="27.6" r="3" fill="currentColor"/>
                <circle cx="24" cy="27.6" r="3" fill="currentColor"/>
            </svg>
            <h1 data-i18n="popupTitle">Oikotie</h1>
        </header>
        <main class="content">
            <section class="toggles-section">
                <label class="toggle-row">
                    <span class="toggle-info">
                        <span class="toggle-name" data-i18n="popupEnableToggle">Auto Login</span>
                        <span class="toggle-desc" data-i18n="popupAutoLoginDescription">Automate redirects and button clicks</span>
                    </span>
                    <span class="toggle-switch">
                        <input type="checkbox" id="autoLoginToggle">
                        <span class="slider"></span>
                    </span>
                </label>

                <label class="toggle-row">
                    <span class="toggle-info">
                        <span class="toggle-name" data-i18n="popupAutofillToggle">Use autofilled credentials</span>
                        <span class="toggle-desc" data-i18n="popupAutofillDescription">Continue login when browser fills saved password</span>
                    </span>
                    <span class="toggle-switch">
                        <input type="checkbox" id="autoFillToggle">
                        <span class="slider"></span>
                    </span>
                </label>
            </section>

            <section class="services-section">
                <div class="section-heading">
                    <span class="section-title" data-i18n="popupServicesTitle">Services</span>
                    <span class="section-desc" data-i18n="popupServicesDescription">Automate the login for these services</span>
                </div>
                <div id="serviceToggles"></div>
            </section>

            <footer class="footer">
                <div class="school-info">
                    <span class="school-name" id="schoolDisplay">—</span>
                    <span class="school-domain" id="domainDisplay">—</span>
                </div>
                <div class="footer-actions">
                    <button type="button" id="changeMunicipality" class="btn-settings" data-i18n="popupChangeSettings">Settings</button>
                </div>
            </footer>
        </main>
    </div>
    
    <script src="../scripts/services.js"></script>
    <script src="i18n.js"></script>
    <script src="popup.js"></script>
</body>
</html>
