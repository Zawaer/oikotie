<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" style="color: #c2410c" role="img" aria-label="Oikotie">
  <title>Oikotie</title>
  <!-- Three steps on a line, and an arc that springs over them and lands past
       the last one. Drawn with currentColor so the same file serves the purple
       mark, the mono toolbar cut and the white-on-purple tile. -->
