  <polygon points="30.4,16.5 22.9,13.5 29.1,8.5" fill="currentColor"/>
  <circle cx="5" cy="27.6" r="3" fill="currentColor"/>
  <circle cx="14.5" cy="27.6" r="3" fill="currentColor"/>
  <circle cx="24" cy="27.6" r="3" fill="currentColor"/>
</svg>
